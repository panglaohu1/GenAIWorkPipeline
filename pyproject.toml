[project]
name = "genai-pipeline"
version = "0.1.0"
description = "本地算力游戏构建流水线：Bonsai/Qwen 推理 + FLUX/Qwen-Image 生图 + MCP 调用 Blender/Godot + Web 控制台"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "mcp>=1.9",
    "jsonschema>=4.23",
    "pillow>=10.4",
    "python-multipart>=0.0.9",
    "psutil>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genai_pipeline"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
